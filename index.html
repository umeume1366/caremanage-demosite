<!DOCTYPE html>
<html lang="ja" data-size="large">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<!-- デモはサーバーと通信しません。このフォルダのファイルだけを使います -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; frame-src blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>ケアブル</title>
<meta name="description" content="介護の連絡を、だれでも、無料で、ひとつの場所で。ケアブルを見本データで試せるデモです。">
<meta name="theme-color" content="#3b2a14">
<link rel="icon" href="favicon.svg?v=20261113d" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=20261113d">
<link rel="stylesheet" href="demo.css?v=20261113d">
</head>
<body>
<header class="demobar" aria-label="デモの操作">
  <div class="demobar-in">
    <div class="demobar-head">
      <span class="mark" aria-hidden="true"></span>
      <span class="name">ケアブル</span>
      <span class="pill">デモ</span>
      <span class="motto">介護の連絡を、だれでも、無料で、ひとつの場所で。</span>
      <button type="button" class="about" id="aboutBtn">ケアブルとは</button>
    </div>
    <div class="row">
      <span class="row-label" id="whoLabel">だれの画面？</span>
      <div class="scroller" id="who" role="group" aria-labelledby="whoLabel"></div>
    </div>
    <div class="row">
      <span class="row-label" id="sigLabel">新しい連絡</span>
      <div class="scroller" role="group" aria-labelledby="sigLabel">
        <button type="button" class="sig" id="sigLook">📨 画面を見ているときに届く</button>
        <button type="button" class="sig" id="sigAway">🔔 ほかの作業中に届く</button>
      </div>
    </div>
    <p class="demohint" id="demoHint" role="status" aria-live="polite"></p>
  </div>
</header>
<div id="stage">
  <div class="fake-tabs" aria-hidden="true">
    <div class="fake-tab"><span class="fav"></span><span class="ttl" id="tabTitle">ケアブル</span><span class="x">×</span></div>
    <span class="fake-tabs-note">↑ ブラウザのタブにも、未読の数が出ます</span>
  </div>
  <div id="app" aria-live="polite"></div>
  <div class="away" id="away" hidden>
    <div class="away-box">
      <p class="away-ttl">💻 いまは、ほかのソフトで作業中です</p>
      <p>ケアブルは裏で開いたままです。新しい連絡が届くと、画面のすみに通知が出ます。</p>
      <button type="button" class="btn secondary" id="awayBack">ケアブルの画面に戻る</button>
    </div>
  </div>
</div>
<div id="noticeArea" class="notice-area" aria-live="assertive"></div>
<div id="toast" role="status" aria-live="assertive"></div>
<noscript><p>ケアブルのデモを使うには、ブラウザの JavaScript を有効にしてください。</p></noscript>

<script src="demo-setup.js?v=20261113d"></script>
<script src="demo-api.js?v=20261113d"></script>
<script src="app.js?v=20261113d"></script>
<script src="demo.js?v=20261113d"></script>
</body>
</html>
